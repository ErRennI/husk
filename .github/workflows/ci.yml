name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build
        run: make EXTRA_CFLAGS=-Werror

      - name: Test
        run: make test

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      - name: Test with Valgrind
        run: make test-valgrind

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t husk .

      - name: Smoke test image
        run: echo "echo hello" | docker run --rm -i husk | grep -x hello
